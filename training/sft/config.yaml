# Conservative LoRA defaults. This config does not identify or download a model.
seed: 42
max_length: 4096
num_train_epochs: 3
learning_rate: 0.0002
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 3
gradient_checkpointing: true
bf16: true
fp16: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
trust_remote_code: false